[project]
name = "truly-tally-ocr"
version = "0.1.0"
description = "Indian GST Invoice OCR & TallyPrime Sync Agent powered by Google ADK 2.0 & Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.2.1",
    "fastapi>=0.110.0",
    "google-adk>=2.6.0",
    "google-genai>=0.1.1",
    "pydantic>=2.6.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]


